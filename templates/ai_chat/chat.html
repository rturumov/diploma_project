{% extends 'base.html' %}
{% load static %}

{% block meta_data %}
<title>AI Ассистент по охране труда</title>
{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto px-4 py-8">
    <h1 class="text-2xl font-bold text-gray-800 mb-2">AI Ассистент</h1>
    <p class="text-gray-500 mb-6">Задайте вопрос по охране труда и технике безопасности</p>

    <div id="chat-box" class="bg-white rounded-2xl shadow p-6 mb-4 min-h-[300px] max-h-[500px] overflow-y-auto flex flex-col gap-4">
        <div class="text-gray-400 text-sm text-center" id="empty-msg">
            Начните диалог — задайте ваш первый вопрос
        </div>
    </div>

    <div class="flex gap-2">
        <input 
            type="text" 
            id="question-input"
            placeholder="Например: есть ли закон о защите при травме на производстве?"
            class="flex-1 border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
        <button 
            id="send-btn"
            class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-xl text-sm font-medium transition"
        >
            Отправить
        </button>
    </div>
</div>

<script>
const chatBox = document.getElementById('chat-box');
const input = document.getElementById('question-input');
const sendBtn = document.getElementById('send-btn');
let chatHistory = [];

function addMessage(text, isUser, sources=[]) {
    document.getElementById('empty-msg')?.remove();
    
    const wrapper = document.createElement('div');
    wrapper.className = isUser ? 'flex justify-end' : 'flex justify-start';

    const bubble = document.createElement('div');
    bubble.className = isUser
        ? 'bg-blue-600 text-white px-4 py-3 rounded-2xl rounded-tr-sm max-w-[80%] text-sm'
        : 'bg-gray-100 text-gray-800 px-4 py-3 rounded-2xl rounded-tl-sm max-w-[80%] text-sm whitespace-pre-wrap';
    bubble.textContent = text;

    wrapper.appendChild(bubble);
    chatBox.appendChild(wrapper);

    if (sources.length > 0) {
        const srcDiv = document.createElement('div');
        srcDiv.className = 'text-xs text-gray-400 px-2';
        srcDiv.innerHTML = '📄 Источники: ' + sources.map(s => s.title).join(', ');
        chatBox.appendChild(srcDiv);
    }

    chatBox.scrollTop = chatBox.scrollHeight;
}

function addLoading() {
    const div = document.createElement('div');
    div.id = 'loading';
    div.className = 'flex justify-start';
    div.innerHTML = '<div class="bg-gray-100 text-gray-400 px-4 py-3 rounded-2xl text-sm">Думаю...</div>';
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
}

async function sendMessage() {
    const question = input.value.trim();
    if (!question) return;

    addMessage(question, true);
    chatHistory.push({ role: 'user', content: question });
    input.value = '';
    sendBtn.disabled = true;
    addLoading();

    try {
        const response = await fetch('/ai/chat/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ question, history: chatHistory })
        });
        const data = await response.json();
        document.getElementById('loading')?.remove();
        
        if (data.error) {
            addMessage('Ошибка: ' + data.error, false);
        } else {
            addMessage(data.answer, false, data.sources);
            chatHistory.push({ role: 'assistant', content: data.answer });
        }
    } catch (e) {
        document.getElementById('loading')?.remove();
        addMessage('Ошибка соединения', false);
    }

    sendBtn.disabled = false;
    input.focus();
}

sendBtn.addEventListener('click', sendMessage);
input.addEventListener('keydown', e => {
    if (e.key === 'Enter') sendMessage();
});
</script>
{% endblock %}
