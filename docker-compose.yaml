services:
  db:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "12345"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - webnet

  redis:
    image: redis:alpine
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - webnet

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    env_file:
      - ./.env
    depends_on:
      - db
      - redis
    volumes:
      - .:/app
      - static_value:/app/static_files
      - media_value:/app/media
    networks:
      - webnet

  nginx:
    image: nginx:1.21.3-alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - static_value:/app/static_files
      - media_value:/app/media
    ports:
      - "80:80"
    depends_on:
      - web
    networks:
      - webnet

networks:
  webnet:

volumes:
  static_value:
  media_value:
  postgres_data: